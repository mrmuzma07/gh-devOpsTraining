---
# Alertmanager Configuration with Runbook URLs and Tier-based Routing
# Modul 02: Error Budget — Alertmanager Integration
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: alertmanager
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.internal:587'
      smtp_from: '[email protected]'
      smtp_auth_username: 'alertmanager'
      smtp_auth_password: 'CHANGE_ME'
    
    route:
      receiver: 'sre-default'
      group_by: ['alertname', 'slo']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      
      routes:
        # Critical SLO breach → Page on-call
        - matchers:
            - slo = "checkout"
            - severity = "critical"
          receiver: 'pagerduty-oncall'
          continue: true
        
        # Feature freeze alert → Notify eng leadership
        - matchers:
            - freeze = "feature-deploy"
          receiver: 'slack-eng-leads'
          continue: true
        
        # Hold risky deploys → Notify SRE
        - matchers:
            - freeze = "hold-risky-deploys"
          receiver: 'slack-sre-lead'
        
        # SLO warnings → Slack SRE
        - matchers:
            - slo =~ "checkout.*"
            - severity = "warning"
          receiver: 'slack-sre'
        
        # Latency alerts
        - matchers:
            - alertname = "SLO_LatencyP95Breach"
          receiver: 'slack-sre'
    
    receivers:
      - name: 'sre-default'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/CHANGE_ME'
            channel: '#sre-alerts'
            title: 'SRE Alert: {{ .GroupLabels.alertname }}'
            text: |
              *Alert:* {{ .GroupLabels.alertname }}
              *Severity:* {{ .CommonLabels.severity }}
              *Summary:* {{ .CommonAnnotations.summary }}
              *Runbook:* {{ .CommonAnnotations.runbook_url }}
      
      - name: 'pagerduty-oncall'
        pagerduty_configs:
          - service_key: 'PD_INTEGRATION_KEY_HERE'
            description: '[{{ .Status }}] {{ .CommonAnnotations.summary }}'
            details:
              runbook: '{{ .CommonAnnotations.runbook_url }}'
              dashboard: '{{ .CommonAnnotations.dashboard_url }}'
      
      - name: 'slack-sre'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/CHANGE_ME'
            channel: '#sre-monitoring'
            title: 'SLO Warning: {{ .GroupLabels.alertname }}'
      
      - name: 'slack-sre-lead'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/CHANGE_ME'
            channel: '#sre-leadership'
            title: '⚠️ HOLD RISKY DEPLOYS'
      
      - name: 'slack-eng-leads'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/CHANGE_ME'
            channel: '#eng-leadership'
            title: '🚨 FEATURE FREEZE: {{ .CommonAnnotations.summary }}'
            text: |
              Error budget < 10% remaining.
              *Action Required:*
              1. Tarik semua PR fitur baru
              2. Fokus ke reliability backlog
              3. Weekly sync sampai budget pulih > 50%
    
    inhibit_rules:
      # Jika budget < 10%, suppress alert budget < 25%
      - source_matchers:
          - alertname = "SLO_BudgetBelow10Percent"
        target_matchers:
          - alertname = "SLO_BudgetBelow25Percent"
