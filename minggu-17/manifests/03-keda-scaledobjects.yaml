apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-credentials
  namespace: production
spec:
  secretTargetRef:
  - parameter: host
    name: rabbitmq-host-secret
    key: host
  - parameter: username
    name: rabbitmq-host-secret
    key: username
  - parameter: password
    name: rabbitmq-host-secret
    key: password
---
# ScaledObject dengan RabbitMQ Scaler
# Setiap pesan queue akan membuat 1 Pod tambahan (max 10).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: order-processor-scaler
  namespace: production
spec:
  scaleTargetRef:
    name: order-processor
  pollingInterval: 10        # Cek antrian setiap 10 detik
  cooldownPeriod: 60        # Scale to zero setelah 60 detik idle
  idleReplicaCount: 0       # Saat queue kosong = 0 Pod (hemat biaya!)
  minReplicaCount: 0
  maxReplicaCount: 10
  triggers:
  - type: rabbitmq
    metadata:
      queueName: orders
      mode: QueueLength
      value: "5"            # Tiap 5 pesan = 1 Pod
    authenticationRef:
      name: rabbitmq-credentials
---
# ScaledObject dengan Cron Scaler (Pre-warm sebelum jam sibuk)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payment-cron-scaler
  namespace: production
spec:
  scaleTargetRef:
    name: payment-service
  minReplicaCount: 1
  maxReplicaCount: 20
  triggers:
  - type: cron
    metadata:
      timezone: Asia/Jakarta
      start: 0 8 * * *       # Jam 08:00 WIB scale up
      end: 0 10 * * *        # Jam 10:00 WIB scale down
      desiredReplicas: "5"
---
# ScaledObject dengan Prometheus Scaler
# Berdasarkan request per detik dari metric response_latency.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: api-prometheus-scaler
  namespace: production
spec:
  scaleTargetRef:
    name: api-gateway
  minReplicaCount: 2
  maxReplicaCount: 15
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      metricName: http_requests_per_second
      threshold: "100"       # >100 RPS per Pod = tambah Pod
      query: |
        sum(rate(http_requests_total{job="api-gateway"}[2m]))