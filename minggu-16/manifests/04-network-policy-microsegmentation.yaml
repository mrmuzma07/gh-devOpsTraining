# Default Deny: Blokir SEMUA traffic masuk dan keluar di namespace.
# Jika di-apply, semua Pod di namespace 'production' terisolasi total.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: production
spec:
  podSelector: {}  # Berlaku untuk SEMUA Pod di namespace ini
  policyTypes:
  - Ingress
  - Egress
---
# Allow Ingress: Izinkan Pod berlabel 'app: backend' menerima dari
# Pod berlabel 'app: frontend' di SEMUA namespace via port 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: staging
    ports:
    - protocol: TCP
      port: 8080
---
# Allow Egress: Izinkan Pod berlabel 'app: backend' HANYA keluar ke:
# 1. Internal kube-system DNS (CoreDNS)
# 2. Database Pod di namespace 'database'
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Egress
  egress:
  # Rule 1: DNS Query keluar
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Rule 2: Database connection
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: database
      podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
